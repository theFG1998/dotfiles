set -g @plugin 'vaaleyard/tmux-dotbar'
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Enable mouse: scroll history, select pane/window, resize panes
set -g mouse on

# Match Alacritty [cursor.style] (Beam + blink). `default` is a block on
# many terminals, and tmux leaves that shape behind when the client exits.
set -g cursor-style blinking-bar

# Detach current session: prefix + q
bind-key q detach-client

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
