[cursor]
unfocused_hollow = true
blink_timeout = 0

[cursor.style]
blinking = "On"
shape = "Beam"

[env]
TERM = "alacritty"

[font]
size = 16.0

[font.normal]
family = "JetBrainsMonoNL Nerd Font Mono"
style = "Medium"

[font.offset]
x = 1
y = 1

[[keyboard.bindings]]
action = "CreateNewWindow"
key = "N"
mods = "Command"

# macOS reports Ctrl-/ as a plain slash. Encode it as the legacy Ctrl-_
# control character so tmux and Neovim can distinguish it from `/`.
[[keyboard.bindings]]
key = "/"
mods = "Control"
chars = "\u001F"

[window]
decorations = "buttonless"
dynamic_padding = false
opacity = 0.9
option_as_alt = "Both"
title = "Alacritty"

[window.padding]
x = 0
y = 0

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
